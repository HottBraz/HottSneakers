
<!-- Modal de Exclusão de Anúncio -->
<div class="modal fade" id="deleteAnuncioModal-{{ anuncio.id }}" tabindex="-1"
    aria-labelledby="deleteAnuncioModalLabel-{{ anuncio.id }}" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="deleteAnuncioModalLabel-{{ anuncio.id }}">Confirmar Exclusão</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p>Tem certeza que deseja excluir o anúncio "<strong>{{ anuncio.titulo }}</strong>"?</p>
            </div>
            <div class="modal-footer">
                <form action="{% url 'excluir-anuncio' anuncio.id %}" method="post" class="d-inline">
                    {% csrf_token %}
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-danger">Confirmar Exclusão</button>
                </form>
            </div>
        </div>
    </div>
</div>
