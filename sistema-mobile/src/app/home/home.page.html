<ion-header [translucent]="true">
  <ion-toolbar color="light">
    <ion-title color="dark">
      Lista de Tênis
    </ion-title>
    <ion-buttons slot="end">
      <ion-button color="dark" (click)="logout()">
        <ion-icon slot="icon-only" name="log-out-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" color="light">
  <!-- Barra de Pesquisa -->
  <div class="search-container">
    <ion-searchbar 
      [(ngModel)]="termo_pesquisa"
      (ionInput)="pesquisar()"
      (ionClear)="limparPesquisa()"
      placeholder="Pesquisar por marca, modelo, tamanho..." 
      color="light"
      showClearButton="always">
    </ion-searchbar>
  </div>

  <!-- Lista de Tênis em Grid -->
  <div class="vehicles-grid">
    <!-- Card de Tênis -->
    <ion-card *ngFor="let tenis of lista_tenis" class="vehicle-card">
      <!-- Imagem do Tênis -->
      <div class="vehicle-image">
        <img *ngIf="tenis.foto" [src]="tenis.foto" alt="{{tenis.modelo}}" />
        <div *ngIf="!tenis.foto" class="no-image">
          <ion-icon name="car-outline"></ion-icon>
        </div>
      </div>

      <!-- Conteúdo do Card -->
      <ion-card-header>
        <ion-card-title class="vehicle-title">
          {{tenis.nome_marca}} {{tenis.modelo}}
        </ion-card-title>
      </ion-card-header>

      <ion-card-content>
        <ion-list lines="none" class="info-list">
          <ion-item>
            <ion-label>
              <strong>Tamanho:</strong> {{tenis.tamanho}}
            </ion-label>
          </ion-item>
          <ion-item>
            <ion-label>
              <strong>Cor:</strong> {{tenis.nome_cor}}
            </ion-label>
          </ion-item>
          <ion-item>
            <ion-label>
              <strong>Tipo:</strong> {{tenis.nome_tipo}}
            </ion-label>
          </ion-item>
        </ion-list>

        <!-- Botões de Ação -->
        <div class="action-buttons">
          <ion-button fill="outline" size="small" color="primary" (click)="editarTenis(tenis.id)">
            <ion-icon slot="start" name="pencil"></ion-icon>
            Editar
          </ion-button>
          <ion-button fill="outline" size="small" color="danger" (click)="excluirTenis(tenis.id)">
            <ion-icon slot="start" name="trash"></ion-icon>
            Excluir
          </ion-button>
        </div>
      </ion-card-content>
    </ion-card>

    <!-- Mensagem quando não há tênis -->
    <div *ngIf="lista_tenis.length === 0" class="empty-state">
      <ion-card class="empty-card">
        <ion-card-content>
          Nenhum tênis encontrado.
        </ion-card-content>
      </ion-card>
    </div>
  </div>

  <!-- Botão Flutuante para Adicionar Tênis -->
  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button color="primary" (click)="adicionarTenis()">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
