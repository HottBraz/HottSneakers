<ion-header [translucent]="true">
  <ion-toolbar color="light">
    <ion-title color="dark">
      Lista de Veículos
    </ion-title>
    <ion-buttons slot="end">
      <ion-button color="dark">
        <ion-icon slot="icon-only" name="log-out-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" color="light">
  <!-- Barra de Pesquisa -->
  <div class="search-container">
    <ion-searchbar placeholder="Pesquisar por marca, modelo..." color="light">
    </ion-searchbar>
    <ion-button expand="block" color="success">
      <ion-icon slot="start" name="search-outline"></ion-icon>
      Pesquisar
    </ion-button>
  </div>

  <!-- Lista de Veículos em Grid -->
  <div class="vehicles-grid">
    <!-- Card de Veículo -->
    <ion-card *ngFor="let veiculo of lista_veiculos" class="vehicle-card">
      <!-- Imagem do Veículo -->
      <div class="vehicle-image">
        <img *ngIf="veiculo.foto" [src]="veiculo.foto" alt="{{veiculo.modelo}}" />
        <div *ngIf="!veiculo.foto" class="no-image">
          <ion-icon name="car-outline"></ion-icon>
        </div>
      </div>

      <!-- Conteúdo do Card -->
      <ion-card-header>
        <ion-card-title class="vehicle-title">
          {{veiculo.nome_marca}} {{veiculo.modelo}}
        </ion-card-title>
      </ion-card-header>

      <ion-card-content>
        <ion-list lines="none" class="info-list">
          <ion-item>
            <ion-label>
              <strong>Ano:</strong> {{veiculo.ano}}
            </ion-label>
          </ion-item>
          <ion-item>
            <ion-label>
              <strong>Cor:</strong> {{veiculo.nome_cor}}
            </ion-label>
          </ion-item>
          <ion-item>
            <ion-label>
              <strong>Combustível:</strong> {{veiculo.nome_combustivel}}
            </ion-label>
          </ion-item>
        </ion-list>

        <!-- Botões de Ação -->
        <div class="action-buttons">
          <ion-button fill="outline" size="small" color="primary">
            <ion-icon slot="start" name="pencil"></ion-icon>
            Editar
          </ion-button>
          <ion-button fill="outline" size="small" color="danger" (click)="excluirVeiculo(veiculo.id)">
            <ion-icon slot="start" name="trash"></ion-icon>
            Excluir
          </ion-button>
        </div>
      </ion-card-content>
    </ion-card>

    <!-- Mensagem quando não há veículos -->
    <div *ngIf="lista_veiculos.length === 0" class="empty-state">
      <ion-card class="empty-card">
        <ion-card-content>
          Nenhum veículo encontrado.
        </ion-card-content>
      </ion-card>
    </div>
  </div>

  <!-- Botão Flutuante para Adicionar Veículo -->
  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button color="success">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
